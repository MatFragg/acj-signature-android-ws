# =============================================================================
# ACJ Signature API - DEV profile
# =============================================================================
# All sensitive values are sourced from env vars (see .env.example).
# NEVER commit real credentials. The dev profile provides NON-SECURE defaults
# ONLY for non-sensitive values (e.g. brand name, default URLs).
# =============================================================================

# ---- Database (PostgreSQL 16) -----------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/android_ws}
spring.datasource.username=${DB_USERNAME:android_ws}
spring.datasource.password=${DB_PASSWORD:android_ws}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ---- App: JWT ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.jwt.issuer=${JWT_ISSUER:acj-signature-api}

# ---- App: OTP ---------------------------------------------------------------
app.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
app.otp.max-failed-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.length=${OTP_LENGTH:6}

# ---- App: Mail --------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.otp-subject=${MAIL_OTP_SUBJECT:Codigo de Verificacion - ACJ Signature}
app.mail.brand-name=${MAIL_BRAND_NAME:ACJ Signature}
app.mail.base-url=${MAIL_BASE_URL:http://localhost:8067}
app.mail.help-url=${MAIL_HELP_URL:http://localhost:8067/help}
app.mail.privacy-url=${MAIL_PRIVACY_URL:http://localhost:8067/privacy}
app.mail.terms-url=${MAIL_TERMS_URL:http://localhost:8067/terms}

# ---- App: RENIEC ------------------------------------------------------------
app.reniec.api-url=${RENIEC_API_URL:https://api.decolecta.com/v1/reniec/dni}
app.reniec.api-token=${RENIEC_API_TOKEN:}
app.reniec.connect-timeout-ms=${RENIEC_CONNECT_TIMEOUT_MS:5000}
app.reniec.read-timeout-ms=${RENIEC_READ_TIMEOUT_MS:5000}

# ---- App: CORS --------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://10.0.2.2:8080}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ---- App: Rate Limit --------------------------------------------------------
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:5}
app.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:10}
app.rate-limit.otp-verify-per-minute=${RATE_LIMIT_OTP_VERIFY_PER_MINUTE:5}
app.rate-limit.forgot-password-per-hour=${RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR:10}

# ---- Bootstrap (admin/user dev accounts) ------------------------------------
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@test.com}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
app.bootstrap.user-email=${BOOTSTRAP_USER_EMAIL:user@test.com}
app.bootstrap.user-password=${BOOTSTRAP_USER_PASSWORD:User123!}

# ---- Server -----------------------------------------------------------------
server.port=${SERVER_PORT:8067}
server.servlet.context-path=/

# ---- Logging ----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.acj.acjsignature.mobile.androidws=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
